services:
  web:
    image: aiandy075/page-summarizer:latest
    build: .
    container_name: page-summarizer
    restart: always
    env_file: .env
    environment:
      HOST: "0.0.0.0"
      PORT: "5000"
    ports:
      - "80:5000"
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
